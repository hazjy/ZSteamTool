name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.1.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      # The version baked into the DLL comes from project(VERSION ...) in
      # src/CMakeLists.txt; the input below only names the tag / package.
      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      # Package layout matches the published release:
      #   Debug\ / Release\ (three DLLs each) + opensteamtool.toml
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Debug, dist/Release | Out-Null
          Copy-Item build/Debug/*   dist/Debug/   -Recurse -Force
          Copy-Item build/Release/* dist/Release/ -Recurse -Force
          Copy-Item opensteamtool.example.toml dist/opensteamtool.toml -Force
          7z a "ZSteamTool-${{ github.event.inputs.version }}.zip" ".\dist\*" -mx5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download `ZSteamTool-${{ github.event.inputs.version }}.zip`.

            Back up the three DLLs in your Steam root directory, then copy
            `OpenSteamTool.dll`, `dwmapi.dll` and `xinput1_4.dll` from `Release\`
            (daily use) or `Debug\` (troubleshooting, verbose logs) into it.

            `opensteamtool.toml` goes to the Steam root directory — upgrades do
            **not** require replacing an existing file (a missing `[denuvo]`
            section already defaults to `normal`).

            Lua configs belong in `<Steam>\config\lua\` — **not**
            `config\stplug-in`.

            Details: `docs/changelog/UPDATE-NOTES-${{ github.event.inputs.version }}.md`
          files: |
            ZSteamTool-${{ github.event.inputs.version }}.zip
